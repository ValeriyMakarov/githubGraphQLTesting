name: Github GraphQL API testing

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose test scope
        required: true
        default: All tests
        type: choice
        options:
          - All tests
          - Smoke
          - Requires watching repositories
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: linter
        run: ruff check
      - name: run all tests
        if: "github.event.inputs.deployment_target == 'All tests'"
        run: pytest
      - name: run smoke tests
        if: "github.event.inputs.deployment_target == 'Smoke'"
        run: pytest -m smoke
      - name: run Requires watching repositories tests
        if: "github.event.inputs.deployment_target == 'Requires watching repositories'"
        run: pytest -m requires_watching_repositories
      - name: Upload logs
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: test_run_data/