name: Manual run

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests from.
        required: true
        type: string

      mark_expression:
        description: Mark expression. Uses "pytest -m" syntax.
        required: false
        type: string

      keyword_expression:
        description: Keyword expression. Uses "pytest -k" syntax.
        required: false
        type: string

      node_id:
        description: Node IDs of tests separated by commas. Uses "pytest path::class::func" syntax.
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.API_TOKEN }}
      GITHUB_USERNAME: ${{ vars.USERNAME }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - name: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: linter
        run: ruff check

      - name: prepare and run pytest
        env:
          MARK_EXP: "${{ inputs.mark_expression }}"
          KEY_EXP: "${{ inputs.keyword_expression }}"
          NODE_IDS: "${{ inputs.node_id }}"
        run: |
          ARGS=()
          
          if [[ -n "$MARK_EXP" ]]; then
            ARGS+=(-m "$MARK_EXP")
          fi
          
          if [[ -n "$KEY_EXP" ]]; then
            ARGS+=(-k "$KEY_EXP")
          fi
          
          if [[ -n "$NODE_IDS" ]]; then
            IFS=',' read -ra IDS <<< "$NODE_IDS"
            ARGS+=("${IDS[@]}")
          fi
          
          echo "Args are: ${ARGS[*]}"
          
          pytest "${ARGS[@]}" -n 0

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/