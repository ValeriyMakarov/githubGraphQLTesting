name: Pull request workflow

on:
  pull_request:
    branches: ["main"]

jobs:
  chech_code_quality:
    runs-on: ubuntu-latest
    steps:
      - name: check testrun results
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -qE "No testrun" <<< "$PR_BODY"; then
            exit 0
          fi
          
          RUN_ID=$(sed -nE "s|.*ValeriyMakarov/githubGraphQLTesting/actions/runs/([0-9]+).*|\1|p" <<< "$PR_BODY")
          if [[ -z "$RUN_ID" ]]; then
            exit 1
          fi
          
          RUN_INFO=$(gh api repos/ValeriyMakarov/githubGraphQLTesting/actions/runs/$RUN_ID)
          if [[ $(jq -r '.status' <<< "$RUN_INFO") != "completed" ||
                $(jq -r '.conclusion' <<< "$RUN_INFO") != "success" ]]; then
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@v7

      - name: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: requirements
        run: pip install ruff

      - name: linter
        run: ruff check