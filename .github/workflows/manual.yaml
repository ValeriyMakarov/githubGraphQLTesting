name: Manual run

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests from.
        required: true
        type: string

      mark:
        description: Pytest mark to use.
        required: false
        type: choice
        default: All tests (.)
        options:
          - All tests (.)
          - smoke
          - requires_watching_repositories

      tests:
        description: Tests to run. Uses "pytest -k" syntax.
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.API_TOKEN }}
      GITHUB_USERNAME: ${{ vars.USERNAME }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - name: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: linter
        run: ruff check

      - name: prepare pytest args
        run: |
          ARGS=""
          if: [ "${{ inputs.mark }}" != "All tests (.)" ]; then
            ARGS="-m ${{ inputs.mark }}"
          fi
          
          if: [ "${{ inputs.tests }}" != "" ]; then
            ARGS="$ARGS -k '${{ inputs.tests }}'"
          fi
          
          echo "ARGS=$ARGS" >> "$GITHUB_ENV"
      - name: run tests
        run: pytest $ARGS

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/