version: 0.2
env:
  git-credential-helper: yes
phases:
  install:
    runtime-versions:
      python: 3.11
      nodejs: 20
      java: corretto17
    commands:
      - git config --global user.email "codebuild-agent@amazon.com"
      - git config --global user.name "AWS CodeBuild"
      - npm install -g allure-commandline
      - pip install -r requirements.txt
  pre_build:
    commands:
      - git fetch origin gh_pages
  build:
    commands:
      - pytest
  post_build:
    commands:
      - aws s3 sync s3://github-graphql-testing-198406025205-eu-north-1-an/allure-history allure-results
      - allure generate allure-results -o allure-report --clean
      - git worktree add .worktrees/gh_pages gh_pages
      - rm -rf .worktrees/gh_pages/docs/
      - mkdir .worktrees/gh_pages/docs/
      - mv allure-report .worktrees/gh_pages/docs/
      - cd .worktrees/gh_pages
      - git add -A -f docs/
      - 'git commit -m "Update allure report #$CODEBUILD_BUILD_NUMBER"'
      - git push origin gh_pages
      - aws s3 sync docs/history/ s3://github-graphql-testing-198406025205-eu-north-1-an/allure-history/history/ --delete


# 1. starting virtual machine
# 2. downloading repository
# 3. downloading dependencies
# 4. downloading branch gh_pages
# 5. running tests
# 6. downloading history (nothing is downloading if this is the first execution)
# 7. generating report using history (without history if this is first execution)
# Status:
#  - allure-results contains individual files test data and history folder (absent if this is first execution)
#  - allure-report contains report
# 8. creating worktree
# 9. deleting old docs folder
# 10. creating new docs folder
# 11. moving new report data to docs folder of gh_pages worktree
# Status:
#  - .worktrees folder has gh_pages folder that corresponding to the gh_pages branch
#  - gh_pages folder has docs folder (new report)
# 12. uploading report to remote gh_pages branch
# 13. uploading history to aws s3
# Status:
#  - aws s3 has history folder, that contains only fresh history, in allure-history prefix
